version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto21
    commands:
      - echo "Checking Java and Maven"
      - java -version
      - mvn -version
      - docker --version

  build:
    commands:
      - echo "Building Maven project"
      - mvn clean package -DskipTests

      - echo "Building Review Docker image"
      - docker build -t review-test ./review

      - echo "Building Product Docker image"
      - docker build -t product-test ./product

      - echo "Checking Docker images"
      - docker images

  post_build:
    commands:
      - echo "Docker build test completed successfully"
