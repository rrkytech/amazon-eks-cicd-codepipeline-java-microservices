name: Java Maven CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Maven Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: mvn clean package

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::591553897650:role/GitHubActionsEKSRole
          aws-region: ap-southeast-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Product Docker image
        run: docker build -t eks-java-product ./product

      - name: Build Review Docker image
        run: docker build -t eks-java-review ./review

      - name: Tag Product Docker image
        run: docker tag eks-java-product:latest 591553897650.dkr.ecr.ap-southeast-2.amazonaws.com/eks-java-product:latest

      - name: Tag Review Docker image
        run: docker tag eks-java-review:latest 591553897650.dkr.ecr.ap-southeast-2.amazonaws.com/eks-java-review:latest

      - name: Push Product image to ECR
        run: docker push 591553897650.dkr.ecr.ap-southeast-2.amazonaws.com/eks-java-product:latest

      - name: Push Review image to ECR
        run: docker push 591553897650.dkr.ecr.ap-southeast-2.amazonaws.com/eks-java-review:latest

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region ap-southeast-2 \
            --name eks-java-cluster

      - name: Configure ALB IngressClass
        run: kubectl apply -f alb-class.yaml

      - name: Deploy Product and Review to EKS
        run: kubectl apply -f k8s-microservices-full.yaml

      - name: Verify Review rollout
        run: kubectl rollout status deployment/review-deployment --timeout=5m

      - name: Verify Product rollout
        run: kubectl rollout status deployment/product-deployment --timeout=5m
